# Gradle Settings
org.gradle.logging.stacktrace = all
org.gradle.jvmargs = -Xmx3G
org.gradle.parallel = true
org.gradle.caching = true
# NOTE: configuration-cache is intentionally left disabled, matching GregTech-GTST (git-version
# plugin resolves git info at configuration time, which is incompatible with it).

# Compilation Options
generate_sources_jar = true
generate_javadocs_jar = false

# Testing
enable_junit_testing = true
show_testing_output = true

# Shadow (not needed -- this addon has no bundled/relocated dependencies)
enable_shadow = false

# Mod Information
mod_version = 1.1.0
root_package = com.windows2000.gtnuclear
mod_id = gtnuclear
mod_name = GTNuclear

# Run Configurations
minecraft_username = Developer
extra_jvm_args =
enable_foundation_debug = false

# Access Transformers (not needed -- this addon has none)
use_access_transformer = false

# Coremods (not needed -- this addon has no coremod/Mixins)
is_coremod = false

minecraft_version = 1.12.2

# Maven Publishing (unused for this addon)
customMavenPublishUrl =
mavenArtifactGroup = com.windows2000.gtnuclear

# CurseForge / Modrinth
curseForgeProjectId =
modrinthProjectId =
curseForgeRelations = requiredDependency:gregtech-ce-unofficial
modrinthRelations = required-project:gregtech
releaseType = release
versionDisplayFormat = $MOD_NAME − $VERSION
clientEnvironment = true
serverEnvironment = true
