/*
 * Add dependencies here, not in build.gradle.
 * Supported configurations (Unimined):
 *  - api / implementation / compileOnly / compileOnlyApi / runtimeOnly / annotationProcessor:
 *       standard Gradle java-library configurations, for dependencies that are already MCP-named
 *       (dev jars, plain libraries -- no deobfuscation needed)
 *  - modApi / modImplementation / modCompileOnly / modRuntimeOnly:
 *       like the above, but for Forge mods whose published jars are SRG-obfuscated (typically
 *       CurseForge/Modrinth player-facing jars). Unimined remaps them at resolve time.
 *
 * CurseMaven coordinates: 'curse.maven:project_slug-project_id:file_id'. Full docs: https://cursemaven.com/
 */
dependencies {

    // Required to compile against GregTech's own public API surface, which references types from these
    // mods (CraftTweaker/GroovyScript integration hooks, AE2 storage bus integration, CTM connected
    // textures, and ModularUI's IGuiHolder implemented by gregtech.api.metatileentity.MetaTileEntity).
    // Versions/coordinates are kept identical to GregTech-GTST's own dependencies.gradle -- using a
    // different fork/version of any of these than the GregTech-GTST dev jar this project compiles
    // against would risk two incompatible copies colliding on the runtime classpath.
    modApi("curse.maven:codechicken-lib-cre-1328922:8553938")
    modApi("com.cleanroommc:modularui:3.1.5") { transitive = false }
    modApi("com.cleanroommc:groovyscript:1.4.3") { transitive = false }
    compileOnly("CraftTweaker2:CraftTweaker2-MC1120-Main:1.12-4.1.20.700")
    modApi("appeng:ae2-uel:v0.56.7") { transitive = false }
    modApi("curse.maven:ctm-267602:2915363") // CTM 1.0.2.31
    modApi("curse.maven:had-enough-items-557549:8934963")
    modApi("curse.maven:the-one-probe-community-edition-885670:8896757")

    // GregTech-GTST itself -- see build.gradle's own flatDir repository comment. Copy
    // GregTech-GTST/build/libs/gregtech-*-dev.jar into this project's libs/ directory (create it if
    // needed) whenever GregTech-GTST is rebuilt, and update the version string below to match. modApi
    // (not modCompileOnly): this addon's own public API types
    // reference GregTech's types directly, and GregTech must actually be present at runtime (runClient)
    // for this addon's hard "required-after:gregtech" @Mod dependency to resolve at all -- a real
    // playtest confirmed modCompileOnly alone produces MissingModsException at startup, since compileOnly-
    // family configurations are never added to the runtime classpath. The test source set inherits this
    // automatically via build.gradle's own sourceSets.test { compileClasspath/runtimeClasspath += ...
    // sourceSets.main.compileClasspath/runtimeClasspath } wiring, so no separate test-scoped declaration
    // is needed here.
    modApi("gregtech:gregtech:1.12.2-2.9.0-1.3.8-GTST-CleanroomMC:dev")

    // Dev-environment-only fix (2026-10): runClient crashed on world exit with
    // NoClassDefFoundError: javax/xml/bind/DatatypeConverter, thrown from AE2 Unofficial Extended Life's
    // GridStorage#getValue on server stop. javax.xml.bind (JAXB) was part of Java SE through 8 but removed
    // from the JDK entirely starting Java 11/17/21/25 -- any 1.12.2-era mod calling it directly breaks once
    // actually run on this project's Java 25 toolchain. Confirmed NOT an issue in CleanroomMC's own
    // official distribution (a real external playtest, 2026-10-10, hit no such crash there) -- Cleanroom's
    // own build.gradle bundles JAXB too, but under the newer jakarta.xml.bind namespace
    // (jakarta.xml.bind:jakarta.xml.bind-api:4.0.5 + org.glassfish.jaxb:jaxb-runtime/jaxb-core:4.0.9), which
    // does not satisfy AE2's own hardcoded javax.xml.bind.DatatypeConverter class reference (a different
    // fully-qualified class name, not just a repackaging) -- Cleanroom's actual end-user distribution
    // apparently carries additional legacy-javax-namespaced libraries beyond what this source repo's own
    // build.gradle shows. Pulling in the final javax-namespaced JAXB release directly here is the standard,
    // well-documented fix for this exact "Java 8->11+ migration" class of error, and only affects this
    // project's own runClient/test runtime classpath -- no GTST or GregTech-Nuclear code is touched.
    runtimeOnly("javax.xml.bind:jaxb-api:2.3.1")
    runtimeOnly("org.glassfish.jaxb:jaxb-runtime:2.3.3")

    // Add your own mod's dependencies below this line.
}
